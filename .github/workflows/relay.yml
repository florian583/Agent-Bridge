name: Rust relay
on:
  push:
    branches: [main]
  pull_request:
jobs:
  relay:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --extra dev
      - run: cargo fmt --check --manifest-path relay/Cargo.toml
      - run: cargo clippy --locked --manifest-path relay/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path relay/Cargo.toml
      - run: cargo build --release --locked --manifest-path relay/Cargo.toml
      - name: Canonical contract and protocol compatibility
        run: |
          PYTHONPATH=src uv run python relay/scripts/export_contract.py
          git diff --exit-code -- relay/contract.json
          BRIDGE_PYTHON="$PWD/.venv/bin/python" uv run python relay/tests/test_protocol.py -v
          PYTHONPATH=src uv run python relay/tests/test_daemon_integration.py -v
