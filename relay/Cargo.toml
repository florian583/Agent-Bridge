[package]
name = "agent-bridge-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "signal", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
